# maibot-mimo-voice 配置模板（0.3.0）
# 复制为 config.toml 后按需修改。最小可用配置只需要 [mimo] 的 api_key。
#
# 33 个键，分两段：
#   基础 —— 日常会调的：音色、触发方式、概率、白名单、失败回退
#   进阶 —— 每段「---- 进阶 ----」之后的键，默认值基本不用动

[plugin]
# 插件开关
enabled = true
# 配置文件版本号，内部使用，不要改
config_version = "0.4.0"

# ================================================================ 基础
[mimo]
# MiMo 官方 API Key（必填），形如 sk-xxxx
api_key = "sk-你的_MiMo_API_Key"
# 基础地址；也可以直接填到 /chat/completions 结尾的完整地址
api_base_url = "https://api.xiaomimimo.com/v1"
# 合成模型（下拉）：
#   mimo-v2.5-tts-voiceclone   克隆音色（默认，配合下面的 preset 用）
#   mimo-v2.5-tts              预置音色（音色由 voice.preset 决定，此项一般不用改）
#   mimo-v2.5-tts-voicedesign  文字描述设计音色
model = "mimo-v2.5-tts-voiceclone"
# 输出格式（下拉）：mp3 = 体积小，推荐；wav = 无损，体积约为 mp3 的 8 倍
audio_format = "mp3"
# 采样温度（滑块 0–1）：越低音色越稳但可能发闷，越高越"生动"但偶尔听出换人
# 实测 0.15 最稳（同句 5 次音高差约 2Hz）；0.6 以上开始明显漂移
temperature = 0.15
# ---- 进阶 ----
# 同时在飞的合成请求数（数字 1–4）：实测 3 路以上明显排队，建议 1
max_concurrent = 1
# 仅对 429 / 5xx / 网络错误重试的次数（数字 0–3）
retry_attempts = 0
# 单次合成超过 [general] timeout 时，换一次请求重来（布尔：true/false）
# 只重试一次：实测超时请求大多直接跳到 30 秒以上，再给一次机会比放宽超时更划算
retry_on_timeout = true
# 重试退避基数（秒），按 2 的幂增长：1.5 → 3 → 6
retry_backoff_seconds = 1.5
# 建立连接的超时（秒），与 [general] timeout 的整体超时分开
connect_timeout = 10.0

[voice]
# 音色（下拉）：
#   bingtang = 内置冰糖（默认，偏亮，随插件分发，开箱可用）
#   jasmine  = 内置茉莉（略低、更柔和，随插件分发）
#   custom   = 自定义参考音频，用下面的 reference_path
preset = "bingtang"
# 仅 preset = custom 时生效：相对路径按插件目录解析，只能读插件目录内的文件
# 建议 5–20 秒干净人声、24kHz 单声道 WAV
reference_path = "reference.wav"
# 朗读风格指令（随请求发给模型的 user 消息，留空 = 不发）
# 这句直接决定语速和语气，改动听感变化很大：含"语速平稳"会明显拖慢
style_instruction = "用同一个人的音色说话，像平时聊天一样语速稍快、句子连贯，不要拖长尾音，情绪自然。"
# ---- 进阶 ----
# 参考音频策略（下拉）：
#   single_file 直接读上面那个文件（默认，不需要 ffmpeg）
#   best_single / balanced / full_merge  需要插件目录下有 ffmpeg，从 voices/ 自动准备
reference_strategy = "single_file"

[trigger]
# 触发方式（下拉）：
#   random      按 probability 随机把整条回复转语音（默认）
#   random_llm  随机抽签 + 模型可主动请求语音（mimo_voice_say），两者互不冲突
#   llm_trigger 语音优先，模型判断更适合文字时调 mimo_voice_text_reply
#   voice_only  所有纯文本回复都转语音
mode = "random"
# 随机概率（滑块 0–1）：0.15 = 约 15% 的回复变语音（之后还会被短句门槛、英文过滤再筛掉一些）
# 低于 0.1 时语音出现得太少，实际体感接近"不会说话"
probability = 0.15
# 判定有效期（秒，0–300）：同一聊天流在这段时间内复用上一次的抽签/模型选择结果
# 默认 10：连发几条时不会一会儿语音一会儿文字
decision_ttl = 10.0
# 短句门槛（数字 0–400）：超过该字数的回复不参与随机转语音，0 = 不限制
# 模型主动请求语音时不受此限
short_reply_max_chars = 60
# 超过 [general] max_text_length 时（下拉）：text = 保留文字不发语音（默认）；truncate = 截断后合成
overflow_policy = "text"
# 英文处理：keep=原样念（ww/emmm 会被逐字母读出来）
#           strip_tics=只删 ww/emmm/ohhhhhhh 这类口癖，LLM/token/cos 等真词保留（推荐）
#           strip=删掉所有两个字母以上的拉丁串（会误伤真词，慎用）
english_policy = "strip_tics"
# 随机触发时，清洗后仍含英文字母就改为发文字（不把 token/LLM 念成字母）；模型主动要语音不受影响
random_requires_chinese = true

[filters]
# 群聊、私聊各自独立（下拉各选一个）：
#   all       全部放行（默认）
#   whitelist 只有列表里的对象转语音
#   blacklist 列表里的对象保持文字，其余转语音
group_mode = "all"
private_mode = "all"
# 群号列表（字符串数组），例：["987654321", "123456789"]
group_ids = []
# 私聊对方 QQ 号列表，例：["10000001"]
private_user_ids = []

[general]
# 单条语音最长字数（数字）：超过时按 [trigger] overflow_policy 处理
max_text_length = 300
# 单次合成超时（秒，建议 10–30）：超时直接回退文字，不重试
timeout = 20.0

[delivery]
# 合成失败/超时时回退发文字（开关，建议开）
fallback_to_text = true
# 并发已满时直接发文字（开关，建议开；关掉会排队，可能拖到超时）
skip_when_busy = true
# 音色对齐（开关，默认关）：按参考音频的频谱补偿每条输出，让每次合成的音色更接近参考。
# 开启后会自动向 MiMo 要 WAV、用 numpy 处理，参考音频必须是 16-bit WAV。
timbre_match = false
# 音色对齐强度（滑块 0–1，建议 1.0）：0=不处理，1=完全对齐；补偿量始终限制在 ±6 dB。
timbre_match_strength = 1.0
