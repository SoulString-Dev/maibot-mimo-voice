# maibot-mimo-voice 配置模板
# 复制为 config.toml 后按需修改；所有项都有默认值，最小可用配置只需要 [mimo] 里的 api_key。

[plugin]
enabled = true
config_version = "0.2.1"

[general]
# 单条语音能承载的最大文字长度；超长按 [trigger] overflow_policy 处理。
max_text_length = 300
# 单次合成超时（秒）。实测 p90 约 28 秒，20 秒是"宁可发文字也不卡住"的折中。
timeout = 20.0

[trigger]
# random：按 probability 随机把整条回复转成语音（默认，约 5%）
# random_llm：随机抽签 + 模型主动请求。模型可以调 mimo_voice_say 指定某轮用语音，
#             其余回复仍按 probability 抽签，两者互不冲突。
# llm_trigger：语音优先，模型判断内容更适合文字时调 mimo_voice_text_reply 改文字
# voice_only：所有纯文本回复都转成语音
mode = "random"
probability = 0.05
random_decision_ttl = 8.0
text_override_ttl = 15.0
# random_llm 模式下，模型请求语音后该聊天流的语音有效期（秒）。
# 不需要太长：一次请求只影响紧随其后的那条回复。
llm_request_ttl = 20.0
# 短句门槛：超过该字数的回复不走随机转语音（0 = 不限制）。
# 模型主动请求（random_llm）和 voice_only 不受这个限制。
short_reply_max_chars = 60
# 超过 general.max_text_length 时：text=保留文字（默认）；truncate=截断后合成
overflow_policy = "text"

[filters]
# 群聊、私聊各自独立判断，都可以选 all / whitelist / blacklist。
# all：全部放行（默认）
# whitelist：只有 group_ids / private_user_ids 里的对象转语音
# blacklist：group_ids / private_user_ids 里的对象保持文字，其余转语音
group_mode = "all"
private_mode = "all"
# 群号列表（配合 group_mode 使用）
group_ids = []
# 私聊对方的 QQ 号列表（配合 private_mode 使用）
private_user_ids = []

[voice]
# 固定参考音频：相对路径按插件目录解析，也可写绝对路径；只允许插件目录内的文件。
# 建议 5–20 秒、干净人声、24kHz 单声道 WAV，已按需做音高/语速调整（见 tools/build_reference.sh）。
reference_path = "reference.wav"
# 参考音频目录：reference_strategy 不是 single_file 时，从这里挑选/拼接素材。
voice_dir = "voices"
# single_file：直接使用 reference_path（默认，不需要 ffmpeg）
# best_single：自动挑选静音少的一段并裁掉首尾静音（需要 ffmpeg）
# balanced：每个文件截取一段后合并（需要 ffmpeg）
# full_merge：完整合并全部文件（需要 ffmpeg）
reference_strategy = "single_file"
preferred_reference_file = ""
max_clip_duration = 15.0
balanced_clip_duration = 3.0
silence_threshold_db = -45.0
sample_rate = 24000
reference_bitrate_kbps = 64
# 参考音频 Base64 上限，MiMo 官方为 10MB，留一点余量。
max_reference_base64_mb = 9.5
# ffmpeg 可执行文件路径，留空则从 PATH 查找。
ffmpeg_path = ""
# 随请求发送的朗读风格指令（user 消息）。实测这一句能把同一段文本多次合成的
# 音高中位数离散度从 σ≈35Hz 压到 σ≈6–14Hz，是"声音不像同一个人"的主要解法。
# 留空则不发送（更自由，但音色漂移明显）。
style_instruction = "用同一个人的音色朗读，语速平稳，情绪自然，不要夸张，不要拖长尾音。"

[mimo]
api_key = "sk-你的_MiMo_API_Key"
# 可填基础地址，也可直接填以 /chat/completions 结尾的完整地址。
api_base_url = "https://api.xiaomimimo.com/v1"
model = "mimo-v2.5-tts-voiceclone"
audio_format = "mp3"
# 采样温度：0.15 是实测最稳的值；调高会更"生动"但音色漂移明显。
temperature = 0.15
top_p = 1.0
# 同时在飞的合成请求数；实测 3 路以上会明显排队，建议 1。
max_concurrent = 1
# 可重试错误（429/5xx/网络）的额外重试次数；超时不会重试。
retry_attempts = 0
# 重试退避基数（秒），按 2 的幂增长。
retry_backoff_seconds = 1.5
# 建连超时（秒），与 general.timeout 的整体超时分开设置。
connect_timeout = 10.0

[delivery]
# 合成失败/超时：true 回退发文字（推荐）；false 直接拦截这条回复。
fallback_to_text = true
# 并发已满时：true 直接发文字；false 排队等待（可能把回复拖到超时）。
skip_when_busy = true
