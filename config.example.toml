# ================================================================
# MiMo TTS 语音回复 配置模板（0.5.3）
# ================================================================
#
# 怎么用：
#   1. 把本文件复制成 config.toml（插件运行时会自动生成一份，直接改那份也可以）；
#   2. 最少只需要填 [mimo] 的 api_key，其余保持默认就能跑；
#   3. 改完保存，插件会自动热重载，不用重启。
#
# 自定义音色放哪：
#   放到插件数据目录的 references/ 下，例如
#     data/plugins/github.SoulString-Dev.maibot-mimo-voice/references/我的音色.wav
#   然后 [voice] preset = "自定义"、reference_path = "我的音色.wav"（只写文件名）。
#   目录不存在时插件会自动创建，启动日志里会打印完整路径。
#
# 阅读方式：
#   每节开头先说明「这一节管什么」，字段注释里写清「取值 / 默认 / 建议」。
#   标了「进阶」的字段，默认值基本不用动。
# ================================================================

[plugin]
# ---- 插件自身 ----
# 总开关：关掉后所有回复都保持文字。
enabled = true
# 配置文件版本，内部用来做迁移，不要手改。
config_version = "0.5.3"

[mimo]
# ---- MiMo 接口 ----
# 必填。到 MiMo 开放平台创建一个 API Key，形如 sk-xxxxxxxx。
api_key = "sk-你的_MiMo_API_Key"
# 接口地址。必须是 https 的公网地址（可以填到 /chat/completions 结尾的完整地址）。
# 写成 localhost / 内网 IP / 云元数据地址会被自动回退成本行的官方地址，并在启动日志里告警。
api_base_url = "https://api.xiaomimimo.com/v1"
# 合成所用模型（下拉）：
#   mimo-v2.5-tts-voiceclone   克隆音色：按 [voice] 里的参考音频克隆（推荐）
#   mimo-v2.5-tts              预置音色：不用参考音频，音色由官方固定音色表决定
#   mimo-v2.5-tts-voicedesign  文字设计音色：用一段描述生成音色，适合没有参考音频时试用
model = "mimo-v2.5-tts-voiceclone"
# 音频格式（下拉）：mp3 = 体积小、发送快（推荐）；wav = 无损，体积约 8 倍。
# 开了 [delivery] 里任一音频后处理（音色对齐 / 尾音裁剪 / 补尾音 / 峰值归一）会自动改用 wav。
audio_format = "mp3"
# 采样温度（滑块 0–1）：越低越稳定，但可能发闷、平；越高越有起伏，但偶尔像换了个人。
# 实测 0.15 时同一句话 5 次的音高差只有约 2 Hz；0.6 以上开始明显漂移。
temperature = 0.15
# ---- 进阶 ----
# 允许把参考音频发往内网 / 本机地址（默认 false）。
# 只有自建了 MiMo 兼容代理、地址在内网时才需要打开；打开后启动日志会记一条警告。
allow_private_base_url = false
# 同时进行的合成请求数（1–4）：实测 3 路以上会排队，建议保持 1。
max_concurrent = 1
# 遇到 429 / 5xx / 网络错误时的重试次数（0–3）。超时不算在内，见下一项。
retry_attempts = 0
# 单次合成超时后，若这条语音的总预算（约 40 秒）还够一次有意义的尝试，就换一条新请求重来（默认开）。
# 补的价值是换一条新连接、可能落到健康的上游节点；预算不足（例如已用掉 25 秒）就直接回退文字。
# 关掉即完全不做超时重试。
retry_on_timeout = true
# 重试的退避基数（秒），按 1.5 → 3 → 6 递增。
retry_backoff_seconds = 1.5
# 建立连接的超时（秒），与整体的 timeout 分开。
connect_timeout = 10.0

[voice]
# ---- 音色 ----
# 用哪个音色（下拉）：
#   理塘王  内置理塘王：低沉、带口音
#   冰糖    内置冰糖：偏亮、偏年轻，MiMo 默认女角色
#   茉莉    内置茉莉：略低、更柔和
#   自定义  用你自己提供的参考音频，配下面的 reference_path
# 下拉里只有中文名；旧写法 bingtang / jasmine / litang / custom 仍能读，读进来自动换成中文。
preset = "理塘王"
# 仅 preset = "自定义" 时生效：只写文件名即可（例如 我的音色.wav）。
# 文件放在插件数据目录的 references/ 下。
# 建议 1–5 秒、干净无背景音、单人说话的 WAV（采样率不限）；超长会自动瘦身。
# 注意是单个文件，不要把多段拼接成一个长文件。
reference_path = "reference.wav"
# 朗读风格指令（会作为 user 消息发给模型，留空 = 不发）。
# 这句直接决定语速和语气：写"语速平稳"会明显变慢、像念稿；下面这句是实测调整过的。
style_instruction = "用同一个人的音色说话，像平时聊天一样语速稍快、句子连贯，不要拖长尾音，情绪自然。"
# ---- 进阶 ----
# 参考音频的准备方式（下拉）：
#   single_file  直接读上面那个文件（默认，不需要 ffmpeg）
#   best_single  从 voices/ 里自动挑一段最干净的（需要 ffmpeg）
#   balanced     从 voices/ 里挑多段拼一个平衡的（需要 ffmpeg）
#   full_merge   把 voices/ 里所有片段合并（需要 ffmpeg，最长）
reference_strategy = "single_file"
# 参考音频自动瘦身（默认 true，仅 single_file + WAV 生效）：
# 发送前把长参考切成单句、去掉句间长静音、拼到约 3.7 秒（3–5 秒区间）并峰值归一到 -3 dBFS。
# 实测线上 8.4 秒 / 4 段 / 18% 静音的参考，换成 3.7 秒拼接版后盲听"像同一个人"明显更稳。
# 已经是短而干净的素材会原样使用，不会重复编码；结果缓存在运行时目录。
auto_prepare_reference = true

[trigger]
# ---- 什么时候发语音 ----
# 触发方式（下拉）：
#   random      按概率随机把整条回复转语音（最省 token，不暴露模型工具）
#   random_llm  随机抽签 + 模型可主动请求语音（默认；群友让它"说句话"时能自己开口）
#   llm_trigger 语音优先，模型觉得该用文字时再切回文字
#   voice_only  所有纯文本回复都转语音（最激进）
mode = "random_llm"
# 随机概率（滑块 0–1）：0.15 ≈ 每 7–10 条回复出一条语音（后面还会被短句、英文过滤再筛一次）。
# 低于 0.1 时会少到几乎感知不到。
probability = 0.15
# 判定有效期（秒，0–300）：同一聊天流在这段时间内沿用上一次的抽签结果，避免一会儿语音一会儿文字。
decision_ttl = 10.0
# 短句门槛（0–400 字）：只把不超过这个字数的回复转语音，0 = 不限制。
# 只约束随机触发；模型主动请求语音时不受此限。
short_reply_max_chars = 60
# 超过 [general] max_text_length 时怎么办（下拉）：
#   text      放弃语音、照常发文字（默认，推荐）
#   truncate  截断到上限后合成
overflow_policy = "text"
# 英文怎么处理（下拉）：
#   keep        原样念（ww、emmm 这类会被逐字母读成 "W W"、"E M M M"）
#   strip_tics  只删 ww/emmm/ohhhhhhh 这类口癖，LLM/token/cos 等真词保留（推荐）
#   strip       删掉所有两个字母以上的拉丁串（会误伤真词，慎用）
english_policy = "strip_tics"
# 随机触发时，清洗后仍含英文字母就改发文字，避免把 token 念成字母。
# 模型主动请求语音时不受此项影响。
random_requires_chinese = true

[filters]
# ---- 在哪些会话里生效 ----
# 群聊、私聊各自独立设置（下拉，各选一个）：
#   all        全部放行（默认）
#   whitelist  只有下面列表里的会话才转语音
#   blacklist  下面列表里的会话保持文字，其余转语音
group_mode = "all"
private_mode = "all"
# 群号列表，例：["987654321", "123456789"]。选了白/黑名单才会用到。
group_ids = []
# 私聊对方 QQ 号列表，例：["10000001"]。
private_user_ids = []

[general]
# ---- 长度与超时 ----
# 单条语音最多多少字：超过时按 [trigger] overflow_policy 处理。
max_text_length = 300
# 超时模式（下拉）：
#   auto   按最近的合成耗时自动调整（默认）：取 p80×1.4，限制在 12–25 秒
#   fixed  固定使用下面的 timeout，行为与 0.5.2 相同
timeout_mode = "auto"
# 单次合成的超时（秒，建议 10–30）：fixed 模式按这个值；auto 模式只是冷启动的初值，样本够了会被动态值取代。
# 超时直接回退文字（不再重发请求）。
timeout = 20.0

[delivery]
# ---- 发送与收尾 ----
# 合成失败或超时时，回退发文字（建议开，否则那条回复会消失）。
fallback_to_text = true
# 并发已满时直接发文字（建议开；关掉会排队，可能拖到超时）。
skip_when_busy = true
# 音色对齐（默认开）：按参考音频的频谱给每条输出做小幅补偿，让每次生成的音色更接近参考。
# 实测能把与参考的频谱差从 5–9 dB 压到 2 dB 左右，代价是每次多几十毫秒 CPU。
# 需要参考音频是 WAV；参考本身很干净、已经很像时，关掉也差不多。
timbre_match = true
# 补偿强度（滑块 0–1）：0 = 不处理，1 = 完全对齐；补偿量始终限制在 ±6 dB，避免刺耳。
# 与参考的频谱距离超过 8 dB 后会自动按比例减弱：距离远说明这条本来就偏离参考，硬怼只会更闷。
timbre_match_strength = 1.0
# 尾部静音裁剪（毫秒，0–3000）：合成结果尾部静音超过这个值才裁，裁完只留 150ms。0 = 不裁。
# 实测 MiMo 尾部静音 94–474ms 不稳定，裁掉后不会有"尾巴拖一下"的感觉。
trim_tail_silence_ms = 250
# 处理完后在尾部补多少毫秒静音（0–1000）：防止播放端把最后一个字吃掉，一般 100–150 够用。
tail_pad_ms = 120
# 峰值归一（默认开）：把每条音量统一拉到 -1.5 dBFS，避免有的条小声、有的条刺耳。
# 最多只往上抬 +6 dB（原 +12 dB 会把呼吸、底噪和削顶一起放大成破音），超出部分交给软限幅。
peak_normalize = true
