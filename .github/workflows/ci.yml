name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装检查与运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy aiohttp pydantic numpy "maibot-plugin-sdk>=2.12"

      - name: Ruff 静态检查
        run: ruff check .

      - name: Mypy 类型检查
        run: mypy plugin.py core

      - name: 单元测试
        run: python tests/run_all.py
