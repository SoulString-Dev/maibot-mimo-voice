[tool.ruff]
# 目标解释器与宿主一致（MaiBot 容器内是 Python 3.13，这里按 3.11 起算）
target-version = "py311"
line-length = 120
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PERF",# performance
    "RUF", # ruff 自身规则
]
# typing.List/Dict 这类旧写法保持原样：改写会产生整文件 diff，
# 对审核与回滚都是干扰，等 0.5.x 重构时再统一。
ignore = [
    "UP006", "UP035", "UP037", "UP045", "E501",
    # 插件文案大量使用中文全角标点，ambiguous-unicode 规则在这里全是误报
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试脚本追求直白，允许在断言里写多行表达式
"tests/*.py" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
show_error_codes = true
